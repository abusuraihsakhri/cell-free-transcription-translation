[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-free-transcription-translation"
version = "3.0.0"
description = "Deterministic cell-free transcription-translation kinetic simulator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
cell-free-transcription-translation = "txtl_simulator.cli:main"

[project.urls]
Repository = "https://github.com/abusuraihsakhri/cell-free-transcription-translation"

[tool.setuptools.packages.find]
include = ["txtl_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
