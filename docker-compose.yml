version: '3.8'

services:
  cell-free-transcription-translation:
    build: .
    container_name: cell-free-transcription-translation
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=cell-free-transcription-translation-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
