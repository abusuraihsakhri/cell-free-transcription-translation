name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev,server]"

      - name: Audit installed dependencies
        run: pip-audit

      - name: Compile Python sources
        run: python -m compileall -q txtl_simulator cli.py txtl_simulator_app.py

      - name: Validate static browser app
        run: |
          node --check web/app.js
          grep -q 'id="runButton"' web/index.html
          grep -q '>Analyze<' web/index.html

      - name: Run tests
        run: pytest -v

      - name: Run simulation smoke test
        run: python cli.py simulate --duration-min 2 --dt-min 0.1

      - name: Run batch smoke test
        run: python cli.py batch -i sample.csv -o out_smoke.csv
